name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run tests (unit + e2e)
        # The Makefile defaults PARALLEL to nproc/2: tests run under -race,
        # whose CPU overhead makes one-test-per-core oversubscription and
        # causes "command bar not ready" flakes in the PTY-driven e2e suite.
        run: make test

      - name: Upload e2e test snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-snapshots
          path: e2e/test-snapshots/
          if-no-files-found: ignore

